name: Build Ghar Tak Android APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK & Permissions
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          yes | sdkmanager --licenses || true

      - name: Build Customer App Debug APK
        run: |
          cd android
          ./gradlew :customer-app:assembleDebug --no-daemon --stacktrace

      - name: Build Technician App Debug APK
        run: |
          cd android
          set -o pipefail
          ./gradlew :technician-app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../tech_build.log

      - name: Report Build Failure Diagnostics
        if: failure()
        run: |
          LOG_FILE="tech_build.log"
          if [ -f "$LOG_FILE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-error-log
            cp "$LOG_FILE" ./tech_error.log
            git add ./tech_error.log
            git commit -m "ci: dump technician build error log" || true
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-error-log --force || true
          fi

      - name: Push APKs to Dist Branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-dist
          mkdir -p apks
          cp android/customer-app/build/outputs/apk/debug/*.apk apks/ || true
          cp android/technician-app/build/outputs/apk/debug/*.apk apks/ || true
          git add apks/*.apk
          git commit -m "dist: latest debug APKs" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-dist --force || true

      - name: Upload Customer App Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-debug-apk
          path: android/customer-app/build/outputs/apk/debug/*.apk

      - name: Upload Technician App Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technician-app-debug-apk
          path: android/technician-app/build/outputs/apk/debug/*.apk