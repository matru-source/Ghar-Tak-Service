name: Build Ghar Tak Android APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK & Permissions
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          yes | sdkmanager --licenses || true

      - name: Build Customer App Debug APK
        run: |
          cd android
          ./gradlew :customer-app:assembleDebug --no-daemon --stacktrace

      - name: Build Technician App Debug APK
        run: |
          cd android
          set -o pipefail
          ./gradlew :technician-app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../tech_build.log

      - name: Report Build Failure Diagnostics
        if: failure()
        run: |
          LOG_FILE="tech_build.log"
          if [ -f "$LOG_FILE" ]; then
            echo "Log file exists at $LOG_FILE"
            grep -E "(e: |error:|FAILED|FAILURE:)" "$LOG_FILE" | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            LINK=$(curl -s -F "file=@$LOG_FILE" https://0x0.st || curl -s -T "$LOG_FILE" https://transfer.sh/tech.log || true)
            echo "::notice title=LogDownloadLink::$LINK"
          else
            echo "::error::Log file not found at $LOG_FILE"
          fi

      - name: Upload Customer App Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-debug-apk
          path: android/customer-app/build/outputs/apk/debug/*.apk

      - name: Upload Technician App Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technician-app-debug-apk
          path: android/technician-app/build/outputs/apk/debug/*.apk