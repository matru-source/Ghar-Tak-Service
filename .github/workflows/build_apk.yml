name: Build Ghar Tak Android APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK & Permissions
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          yes | sdkmanager --licenses || true

      - name: Build Customer App Debug APK
        run: |
          set -e -o pipefail
          cd android
          ./gradlew :customer-app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/customer_build.log || {
            echo "## ❌ Customer App Build Log (Failure)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/customer_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "=== FAILED CUSTOMER BUILD LOG TAIL ==="
            tail -n 120 /tmp/customer_build.log
            while IFS= read -r line; do
              echo "::error title=Compiler::$line"
            done < <(grep -E 'e: |FAILURE:|Caused by:|Compilation error' /tmp/customer_build.log | head -n 25)
            while IFS= read -r line; do
              echo "::error title=LogTail::$line"
            done < <(tail -n 15 /tmp/customer_build.log)
            exit 1
          }

      - name: Build Technician App Debug APK
        run: |
          set -e -o pipefail
          cd android
          ./gradlew :technician-app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/technician_build.log || {
            echo "## ❌ Technician App Build Log (Failure)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/technician_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "=== FAILED TECHNICIAN BUILD LOG TAIL ==="
            tail -n 120 /tmp/technician_build.log
            while IFS= read -r line; do
              echo "::error title=Compiler::$line"
            done < <(grep -E 'e: |FAILURE:|Caused by:|Compilation error' /tmp/technician_build.log | head -n 25)
            while IFS= read -r line; do
              echo "::error title=LogTail::$line"
            done < <(tail -n 15 /tmp/technician_build.log)
            exit 1
          }

      - name: Upload Build Logs On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: /tmp/*_build.log
          if-no-files-found: ignore

      - name: Upload Customer App Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-debug-apk
          path: android/customer-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Technician App Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: technician-app-debug-apk
          path: android/technician-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error