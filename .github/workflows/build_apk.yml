name: Build Ghar Tak Android APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI with 1 click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Customer App Debug APK
        run: |
          cd android
          ./gradlew :customer-app:assembleDebug --no-daemon

      - name: Build Technician App Debug APK
        run: |
          cd android
          ./gradlew :technician-app:assembleDebug --no-daemon

      - name: Upload Customer App Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-debug-apk
          path: android/customer-app/build/outputs/apk/debug/*.apk

      - name: Upload Technician App Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: technician-app-debug-apk
          path: android/technician-app/build/outputs/apk/debug/*.apk
