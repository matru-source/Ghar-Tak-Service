name: Build Flutter Cross-Platform APKs

on:
  push:
    branches: [ main, master, flutter-cross-platform ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flutter-apps:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses & Doctor
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Build Flutter Customer App APK
        run: |
          set -e -o pipefail
          cd flutter_apps/customer_app
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --org=com.ghartak.customer --project-name=customer_app --overwrite
          cp pubspec.yaml.bak pubspec.yaml
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          flutter pub get
          flutter build apk --debug 2>&1 | tee /tmp/flutter_customer.log || {
            echo "## ❌ Flutter Customer Build Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/flutter_customer.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/GharTak-Customer.apk

      - name: Build Flutter Technician App APK
        run: |
          set -e -o pipefail
          cd flutter_apps/technician_app
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --org=com.ghartak.technician --project-name=technician_app --overwrite
          cp pubspec.yaml.bak pubspec.yaml
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          flutter pub get
          flutter build apk --debug 2>&1 | tee /tmp/flutter_technician.log || {
            echo "## ❌ Flutter Technician Build Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/flutter_technician.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/GharTak-Technician.apk

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-failure-logs
          path: /tmp/flutter_*.log
          if-no-files-found: ignore

      - name: Upload Flutter Customer APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-customer-app-debug-apk
          path: flutter_apps/customer_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload Flutter Technician APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-technician-app-debug-apk
          path: flutter_apps/technician_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
