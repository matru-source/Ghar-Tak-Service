name: Build Flutter Cross-Platform APKs

on:
  push:
    branches: [ main, master, flutter-cross-platform ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flutter-apps:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses & Doctor
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Build Flutter Customer App APK
        run: |
          set -e -o pipefail
          echo "=== 1. Generating clean Android scaffolding in /tmp ==="
          rm -rf /tmp/scaffold_cust
          flutter create --platforms=android --org=com.ghartak.customer --project-name=customer_app /tmp/scaffold_cust

          echo "=== 2. Copying Android scaffolding to customer_app ==="
          rm -rf flutter_apps/customer_app/android
          cp -r /tmp/scaffold_cust/android flutter_apps/customer_app/android

          echo "=== 3. Injecting GTS Branding, Icons & App Label ==="
          # Copy official high-res GTS mipmaps
          cp -r android/customer-app/src/main/res/mipmap-* flutter_apps/customer_app/android/app/src/main/res/

          # Update AndroidManifest.xml with Ghar Tak app title
          sed -i 's/android:label="customer_app"/android:label="Ghar Tak"/g' flutter_apps/customer_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^\"]*"/android:label="Ghar Tak"/g' flutter_apps/customer_app/android/app/src/main/AndroidManifest.xml

          # Ensure Android SDK path in local.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" >> flutter_apps/customer_app/android/local.properties

          echo "=== 4. Compiling Ghar Tak Customer Flutter APK ==="
          cd flutter_apps/customer_app
          flutter pub get
          flutter build apk --debug 2>&1 | tee /tmp/flutter_customer.log || {
            echo "## ❌ Flutter Customer Build Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/flutter_customer.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/GharTak-Customer.apk

      - name: Build Flutter Technician App APK
        run: |
          set -e -o pipefail
          echo "=== 1. Generating clean Android scaffolding in /tmp ==="
          rm -rf /tmp/scaffold_tech
          flutter create --platforms=android --org=com.ghartak.technician --project-name=technician_app /tmp/scaffold_tech

          echo "=== 2. Copying Android scaffolding to technician_app ==="
          rm -rf flutter_apps/technician_app/android
          cp -r /tmp/scaffold_tech/android flutter_apps/technician_app/android

          echo "=== 3. Injecting GTS Branding, Icons & App Label ==="
          # Copy official high-res GTS mipmaps
          cp -r android/technician-app/src/main/res/mipmap-* flutter_apps/technician_app/android/app/src/main/res/

          # Update AndroidManifest.xml with Ghar Tak Partner app title
          sed -i 's/android:label="technician_app"/android:label="Ghar Tak Partner"/g' flutter_apps/technician_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^\"]*"/android:label="Ghar Tak Partner"/g' flutter_apps/technician_app/android/app/src/main/AndroidManifest.xml

          # Ensure Android SDK path in local.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" >> flutter_apps/technician_app/android/local.properties

          echo "=== 4. Compiling Ghar Tak Partner Technician Flutter APK ==="
          cd flutter_apps/technician_app
          flutter pub get
          flutter build apk --debug 2>&1 | tee /tmp/flutter_technician.log || {
            echo "## ❌ Flutter Technician Build Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/flutter_technician.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/GharTak-Partner.apk

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-failure-logs
          path: /tmp/flutter_*.log
          if-no-files-found: ignore

      - name: Upload Ghar Tak Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: GharTak-Customer-APK
          path: flutter_apps/customer_app/build/app/outputs/flutter-apk/GharTak-Customer.apk
          if-no-files-found: error

      - name: Upload Ghar Tak Partner Technician APK
        uses: actions/upload-artifact@v4
        with:
          name: GharTak-Partner-APK
          path: flutter_apps/technician_app/build/app/outputs/flutter-apk/GharTak-Partner.apk
          if-no-files-found: error
