name: Build Flutter Cross-Platform APKs

on:
  push:
    branches: [ main, master, flutter-cross-platform ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flutter-apps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Print Flutter Environment
        run: flutter doctor -v

      - name: Build Flutter Customer App APK
        run: |
          cd flutter_apps/customer_app
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --org=com.ghartak.customer --project-name=customer_app
          cp pubspec.yaml.bak pubspec.yaml
          flutter pub get
          flutter build apk --debug

      - name: Build Flutter Technician App APK
        run: |
          cd flutter_apps/technician_app
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --org=com.ghartak.technician --project-name=technician_app
          cp pubspec.yaml.bak pubspec.yaml
          flutter pub get
          flutter build apk --debug

      - name: Upload Flutter Customer APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-customer-app-debug-apk
          path: flutter_apps/customer_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload Flutter Technician APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-technician-app-debug-apk
          path: flutter_apps/technician_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
