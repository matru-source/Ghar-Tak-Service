name: Build Flutter Cross-Platform APKs

on:
  push:
    branches: [ main, master, flutter-cross-platform ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flutter-apps:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses & Doctor
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Build Flutter Customer App APK
        run: |
          set -e -o pipefail
          cd flutter_apps/customer_app

          echo "=== 1. Backing up real Customer App Dart code and pubspec ==="
          rm -rf /tmp/cust_lib_backup /tmp/cust_pubspec_backup
          cp -r lib /tmp/cust_lib_backup
          cp pubspec.yaml /tmp/cust_pubspec_backup

          echo "=== 2. Generating standard Android scaffolding ==="
          flutter create . --platforms=android --org=com.ghartak.customer --project-name=customer_app --overwrite

          echo "=== 3. Restoring real Ghar Tak Customer code ==="
          rm -rf lib pubspec.yaml
          cp -r /tmp/cust_lib_backup lib
          cp /tmp/cust_pubspec_backup pubspec.yaml

          echo "=== 4. Injecting GTS Icons and App Name ==="
          cp -r ../../android/customer-app/src/main/res/mipmap-* android/app/src/main/res/
          sed -i 's/android:label="customer_app"/android:label="Ghar Tak"/g' android/app/src/main/AndroidManifest.xml

          echo "=== 5. Compiling Ghar Tak Customer Flutter APK ==="
          flutter pub get
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/GharTak-Customer.apk

      - name: Build Flutter Technician App APK
        run: |
          set -e -o pipefail
          cd flutter_apps/technician_app

          echo "=== 1. Backing up real Technician App Dart code and pubspec ==="
          rm -rf /tmp/tech_lib_backup /tmp/tech_pubspec_backup
          cp -r lib /tmp/tech_lib_backup
          cp pubspec.yaml /tmp/tech_pubspec_backup

          echo "=== 2. Generating standard Android scaffolding ==="
          flutter create . --platforms=android --org=com.ghartak.technician --project-name=technician_app --overwrite

          echo "=== 3. Restoring real Ghar Tak Partner code ==="
          rm -rf lib pubspec.yaml
          cp -r /tmp/tech_lib_backup lib
          cp /tmp/tech_pubspec_backup pubspec.yaml

          echo "=== 4. Injecting GTS Icons and App Name ==="
          cp -r ../../android/technician-app/src/main/res/mipmap-* android/app/src/main/res/
          sed -i 's/android:label="technician_app"/android:label="Ghar Tak Partner"/g' android/app/src/main/AndroidManifest.xml

          echo "=== 5. Compiling Ghar Tak Partner Technician Flutter APK ==="
          flutter pub get
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/GharTak-Partner.apk

      - name: Upload Ghar Tak Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: GharTak-Customer-APK
          path: flutter_apps/customer_app/build/app/outputs/flutter-apk/GharTak-Customer.apk
          if-no-files-found: error

      - name: Upload Ghar Tak Partner Technician APK
        uses: actions/upload-artifact@v4
        with:
          name: GharTak-Partner-APK
          path: flutter_apps/technician_app/build/app/outputs/flutter-apk/GharTak-Partner.apk
          if-no-files-found: error
